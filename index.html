<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinnerCards: 4th & 5th Gen Fighters</title>
<style>
  :root {
    --bg: #0f1419;
    --card-bg: #1a2332;
    --cyan: #00d4ff;
    --orange: #ff9f43;
    --white: #ffffff;
    --muted: #8b9bb4;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 12px;
  }
  .header {
    text-align: center;
    margin-bottom: 8px;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .status-line {
    text-align: center;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .status-line .turn { color: var(--cyan); font-weight: 600; }
  .card-display {
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid #2a3a50;
    position: relative;
  }
  .card-image {
    width: 100%;
    height: 200px;
    object-fit: contain;
    background: #111820;
    cursor: grab;
  }
  .card-name {
    text-align: center;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 10px 8px 4px;
  }
  .stats { padding: 0 12px 12px; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #2a3a50;
    cursor: pointer;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row:hover, .stat-row:active { background: #243044; }
  .stat-label { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .stat-label.higher { color: var(--cyan); }
  .stat-label.lower { color: var(--orange); }
  .stat-value { font-weight: 500; color: var(--white); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .dot.better { background: var(--green); }
  .dot.medium { background: #ffffff; }
  .dot.worse { background: var(--red); }
  .result {
    text-align: center;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    min-height: 48px;
  }
  .result.win { color: var(--green); }
  .result.lose { color: var(--red); }
  .result.tie { color: #fbbf24; }
  .hidden { display: none; }
  .lobby, .game-over { text-align: center; padding: 40px 16px; }
  button, input {
    background: var(--cyan);
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin: 8px;
  }
  input {
    background: #243044;
    color: white;
    text-align: center;
    width: 140px;
    letter-spacing: 4px;
    font-size: 1.2rem;
  }
  .pile-info {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 8px;
  }
  .room-code {
    font-size: 2rem;
    letter-spacing: 8px;
    font-weight: 700;
    color: var(--cyan);
    margin: 16px 0;
  }
  .debug {
    background: #1a2332;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: left;
    position: relative;
  }
  .popup {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: #1a2332;
    color: var(--green);
    font-weight: 700;
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    z-index: 2;
  }
  .image-dots {
    text-align: center;
    padding: 6px 0;
  }
  .image-dots span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4a5568;
    margin: 0 3px;
  }
  .image-dots span.active { background: var(--cyan); }
</style>
</head>
<body>

<div class="header">WinnerCards: 4th & 5th Gen Fighters</div>
<div class="status-line" id="statusLine">Waiting…</div>

<div id="lobby" class="lobby">
  <button onclick="createRoom()">Create Room</button>
  <div style="margin: 24px 0; color: var(--muted);">or</div>
  <div>
    <input id="joinCode" type="text" maxlength="4" placeholder="CODE" style="text-transform:uppercase">
    <button onclick="joinRoom()">Join</button>
  </div>
  <div id="lobbyStatus" style="margin-top:20px; color:var(--muted);"></div>
</div>

<div id="gameScreen" class="hidden">
  <div class="debug" id="debugInfo"></div>
  <div class="pile-info" id="pileInfo"></div>
  <div class="card-display">
    <img class="card-image" id="cardImage" src="" alt="">
    <div class="image-dots" id="imageDots"></div>
    <div class="card-name" id="cardName">—</div>
    <div class="stats" id="statsContainer"></div>
  </div>
  <div class="result" id="resultDisplay"></div>
</div>

<div id="gameOverScreen" class="game-over hidden">
  <h2 id="winnerText"></h2>
  <button onclick="location.reload()">New Game</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaBiEDrDw_tDxGSwEf6vBmQbPPDq_Ftu8",
  authDomain: "winnercards-e0343.firebaseapp.com",
  databaseURL: "https://winnercards-e0343-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "winnercards-e0343",
  storageBucket: "winnercards-e0343.firebasestorage.app",
  messagingSenderId: "563899363919",
  appId: "1:563899363919:web:ea3b085a70268ead2bf03a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomCode = null;
let myPlayer = null;
let cards = [];
let criteria = [];
let gameRef = null;
let currentImageIndex = 0;
let currentImages = [];
let popupTimeout = null;
let autoRotateTimer = null;

async function loadCards() {
  const res = await fetch("4and5genfighters.json");
  const data = await res.json();
  cards = data.cards;
  criteria = data.criteria || [];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateCode() {
  return Math.random().toString(36).substring(2, 6).toUpperCase();
}

window.createRoom = async function() {
  await loadCards();
  roomCode = generateCode();
  myPlayer = 1;
  const deck = shuffle(cards);
  const initialState = {
    p1: deck.slice(0, 16),
    p2: deck.slice(16),
    turn: Math.random() < 0.5 ? 1 : 2,
    pending: [],
    status: "waiting",
    lastWinner: null,
    debug: null
  };
  gameRef = ref(db, `rooms/${roomCode}`);
  await set(gameRef, initialState);
  document.getElementById("lobbyStatus").innerHTML = `
    <div>Code:</div>
    <div class="room-code">${roomCode}</div>
    <div>Waiting for player 2…</div>
  `;
  listenToGame();
};

window.joinRoom = async function() {
  const code = document.getElementById("joinCode").value.trim().toUpperCase();
  if (code.length !== 4) return;
  await loadCards();
  roomCode = code;
  myPlayer = 2;
  gameRef = ref(db, `rooms/${roomCode}`);
  const snap = await get(gameRef);
  if (!snap.exists()) {
    document.getElementById("lobbyStatus").textContent = "Room not found";
    return;
  }
  await update(gameRef, { status: "playing" });
  document.getElementById("lobby").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  listenToGame();
};

function listenToGame() {
  onValue(gameRef, (snap) => {
    const state = snap.val();
    if (!state) return;
    if (state.status === "playing") {
      document.getElementById("lobby").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
    }
    renderState(state);
  });
}

function getImages(card) {
  if (card.images && card.images.length) return card.images;
  if (card.image) return [card.image];
  return [];
}

function resolveImageSrc(src) {
  if (!src) return "";
  if (src.startsWith("http")) return src;
  return `images/${src}`;
}

function startAutoRotate() {
  if (autoRotateTimer) clearInterval(autoRotateTimer);
  if (currentImages.length <= 1) return;
  autoRotateTimer = setInterval(() => {
    currentImageIndex = (currentImageIndex + 1) % currentImages.length;
    document.getElementById("cardImage").src = resolveImageSrc(currentImages[currentImageIndex]);
    document.querySelectorAll("#imageDots span").forEach((s, i) => {
      s.classList.toggle("active", i === currentImageIndex);
    });
  }, 3500);
}

function stopAutoRotate() {
  if (autoRotateTimer) {
    clearInterval(autoRotateTimer);
    autoRotateTimer = null;
  }
}

function showPopup(text) {
  const debug = document.getElementById("debugInfo");
  let popup = debug.querySelector(".popup");
  if (!popup) {
    popup = document.createElement("div");
    popup.className = "popup";
    debug.appendChild(popup);
  }
  popup.textContent = text;
  popup.style.display = "block";
  if (popupTimeout) clearTimeout(popupTimeout);
  popupTimeout = setTimeout(() => { popup.style.display = "none"; }, 1800);
}

function renderState(state) {
  const myCards = myPlayer === 1 ? (state.p1 || []) : (state.p2 || []);
  if (myCards.length === 0) {
    endGame(myPlayer === 1 ? 2 : 1);
    return;
  }
  const card = myCards[0];
  const isMyTurn = state.turn === myPlayer && state.status === "playing";

  document.getElementById("statusLine").innerHTML = `
    <span class="turn">${isMyTurn ? "Your turn" : "Opponent's turn"}</span>
    · Your cards: ${myCards.length}
  `;

  currentImages = getImages(card);
  currentImageIndex = 0;
  const imgEl = document.getElementById("cardImage");
  imgEl.src = currentImages.length ? resolveImageSrc(currentImages[0]) : "";
  startAutoRotate();

  const dots = document.getElementById("imageDots");
  dots.innerHTML = currentImages.map((_, i) => `<span class="${i===0?'active':''}"></span>`).join("");

  const flag = card.flag || "";
  document.getElementById("cardName").textContent = `${flag} ${card.name}`.trim();

  const stats = document.getElementById("statsContainer");
  stats.innerHTML = "";
  criteria.forEach(cat => {
    const row = document.createElement("div");
    row.className = "stat-row";
    const cls = cat.higher ? "higher" : "lower";
    const val = card[cat.key] ?? "—";
    const rating = card.ratings?.[cat.key] || "medium";
    row.innerHTML = `
      <span class="stat-label ${cls}">
        <span class="dot ${rating}"></span>
        ${cat.label}
      </span>
      <span class="stat-value">${val} ${cat.unit}</span>
    `;
    if (isMyTurn) {
      row.onclick = () => playCategory(cat, state);
    } else {
      row.querySelector(".stat-label").style.opacity = "0.45";
      row.style.cursor = "default";
    }
    stats.appendChild(row);
  });

  document.getElementById("pileInfo").textContent = (state.pending && state.pending.length)
    ? `${state.pending.length} cards on the pile (tie)`
    : "";

  const debug = document.getElementById("debugInfo");
  debug.innerHTML = state.debug || "";

  const resultEl = document.getElementById("resultDisplay");
  resultEl.className = "result";
  if (state.lastWinner === 0) {
    resultEl.textContent = "Tie – cards stay on the pile";
    resultEl.classList.add("tie");
  } else if (state.lastWinner === myPlayer) {
    resultEl.textContent = "";
    showPopup("You win!");
  } else if (state.lastWinner && state.lastWinner !== myPlayer) {
    resultEl.textContent = "You lost";
    resultEl.classList.add("lose");
  } else {
    resultEl.textContent = "";
  }
}

// Simple swipe
let touchStartX = 0;
document.getElementById("cardImage").addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].screenX;
  stopAutoRotate();
});
document.getElementById("cardImage").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) < 40) return;
  if (dx < 0) currentImageIndex = Math.min(currentImageIndex + 1, currentImages.length - 1);
  else currentImageIndex = Math.max(currentImageIndex - 1, 0);
  document.getElementById("cardImage").src = resolveImageSrc(currentImages[currentImageIndex]);
  document.querySelectorAll("#imageDots span").forEach((s, i) => {
    s.classList.toggle("active", i === currentImageIndex);
  });
});

async function playCategory(cat, state) {
  const p1 = [...(state.p1 || [])];
  const p2 = [...(state.p2 || [])];
  if (p1.length === 0 || p2.length === 0) return;

  const c1 = p1[0];
  const c2 = p2[0];
  const v1 = Number(c1[cat.key]);
  const v2 = Number(c2[cat.key]);

  let winner = 0;
  if (!isNaN(v1) && !isNaN(v2)) {
    if (cat.higher) {
      if (v1 > v2) winner = 1;
      else if (v2 > v1) winner = 2;
    } else {
      if (v1 < v2) winner = 1;
      else if (v2 < v1) winner = 2;
    }
  }

  const pending = [...(state.pending || [])];
  const wonCards = [c1, c2, ...pending];

  let newP1 = p1.slice(1);
  let newP2 = p2.slice(1);
  let newPending = [];
  let nextTurn = state.turn;

  if (winner === 0) {
    newPending = [...pending, c1, c2];
    nextTurn = state.turn;
  } else {
    if (winner === 1) newP1 = [...newP1, ...wonCards];
    else newP2 = [...newP2, ...wonCards];
    nextTurn = winner;
  }

  const debugText = `${cat.label}: ${c1.name} (${v1}) vs ${c2.name} (${v2}) → Winner: ${winner === 0 ? "Tie" : "Player " + winner}`;

  await update(gameRef, {
    p1: newP1,
    p2: newP2,
    pending: newPending,
    turn: nextTurn,
    lastWinner: winner,
    debug: debugText
  });
}

function endGame(winner) {
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.remove("hidden");
  document.getElementById("winnerText").textContent = winner === myPlayer ? "" : "You lost";
}
</script>
</body>
</html>
