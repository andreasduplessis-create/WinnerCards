<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinnerCards – Kampfflieger</title>
<style>
  :root {
    --bg: #0f1419;
    --card-bg: #1a2332;
    --cyan: #00d4ff;
    --orange: #ff9f43;
    --white: #ffffff;
    --muted: #8b9bb4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 12px;
  }
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 { font-size: 1.4rem; }
  .status {
    background: #243044;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 16px;
    text-align: center;
  }
  .status .turn { font-size: 1.1rem; font-weight: 600; color: var(--cyan); }
  .status .you { font-size: 0.95rem; color: var(--orange); margin-top: 4px; }
  .status .counts { color: var(--muted); margin-top: 4px; }
  .card-display {
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid #2a3a50;
  }
  .card-image {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #111820;
  }
  .card-name {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    padding: 12px 8px 4px;
  }
  .stats { padding: 0 12px 12px; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #2a3a50;
    cursor: pointer;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row:hover, .stat-row:active { background: #243044; }
  .stat-label { font-weight: 600; }
  .stat-label.higher { color: var(--cyan); }
  .stat-label.lower { color: var(--orange); }
  .stat-value { font-weight: 500; }
  .result {
    text-align: center;
    padding: 16px;
    font-size: 1.2rem;
    font-weight: 700;
    min-height: 60px;
  }
  .result.win { color: #4ade80; }
  .result.lose { color: #f87171; }
  .result.tie { color: #fbbf24; }
  .hidden { display: none; }
  .start-screen, .game-over {
    text-align: center;
    padding: 40px 16px;
  }
  button {
    background: var(--cyan);
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin: 8px;
  }
  .pile-info {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 8px;
  }
  .player-select { margin: 20px 0; }
  .player-select button { min-width: 180px; }
</style>
</head>
<body>

<div class="header">
  <h1>WinnerCards</h1>
  <div>Kampfflieger Top Ass</div>
</div>

<div id="startScreen" class="start-screen">
  <p style="margin-bottom:8px;">Pass and Play (ein Gerät)</p>
  <div class="player-select">
    <button onclick="startGame(1)">Ich bin Spieler 1</button>
    <button onclick="startGame(2)">Ich bin Spieler 2</button>
  </div>
  <p style="color:var(--muted); font-size:0.85rem; margin-top:12px;">
    Reicht das Handy nach jedem Zug an den anderen Spieler weiter.
  </p>
</div>

<div id="gameScreen" class="hidden">
  <div class="status">
    <div class="turn" id="turnDisplay">Spieler 1 ist am Zug</div>
    <div class="you" id="youDisplay">Du bist Spieler 1</div>
    <div class="counts" id="countDisplay">Karten: 16 | 16</div>
  </div>

  <div class="pile-info" id="pileInfo"></div>

  <div class="card-display" id="cardDisplay">
    <img class="card-image" id="cardImage" src="" alt="">
    <div class="card-name" id="cardName">—</div>
    <div class="stats" id="statsContainer"></div>
  </div>

  <div class="result" id="resultDisplay"></div>
</div>

<div id="gameOverScreen" class="game-over hidden">
  <h2 id="winnerText">Spieler 1 gewinnt!</h2>
  <button onclick="location.reload()">Neues Spiel</button>
</div>

<script>
const CATEGORIES = [
  { key: "speed", label: "SPEED", higher: true, unit: "km/h" },
  { key: "thrust_hubkraft", label: "HUBKRAFT", higher: true, unit: "kg" },
  { key: "ceiling", label: "CEILING", higher: true, unit: "m" },
  { key: "empty_weight", label: "EMPTY", higher: false, unit: "kg" },
  { key: "range", label: "RANGE", higher: true, unit: "km" },
  { key: "climb", label: "CLIMB", higher: true, unit: "m/s" },
  { key: "t_w_ratio", label: "T/W", higher: true, unit: "" },
  { key: "payload", label: "PAYLOAD", higher: false, unit: "kg" }
];

let cards = [];
let player1 = [], player2 = [];
let currentPlayer = 1;
let myPlayer = 1;
let pendingCards = [];
let gameActive = false;

async function loadData() {
  const res = await fetch("kampfflieger_topass_dataset.json");
  const data = await res.json();
  cards = data.cards;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function startGame(player) {
  myPlayer = player;
  await loadData();
  const deck = shuffle([...cards]);
  player1 = deck.slice(0, 16);
  player2 = deck.slice(16);
  currentPlayer = Math.random() < 0.5 ? 1 : 2;
  pendingCards = [];
  gameActive = true;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  updateUI();
}

function getCurrentDeck() {
  return currentPlayer === 1 ? player1 : player2;
}

function updateUI() {
  const deck = getCurrentDeck();
  if (deck.length === 0) {
    endGame(currentPlayer === 1 ? 2 : 1);
    return;
  }
  const card = deck[0];
  document.getElementById("turnDisplay").textContent = `Spieler ${currentPlayer} ist am Zug`;
  document.getElementById("youDisplay").textContent = `Du bist Spieler ${myPlayer}`;
  document.getElementById("countDisplay").textContent = `Karten: ${player1.length} | ${player2.length}`;
  document.getElementById("cardImage").src = `images/${card.image}`;
  document.getElementById("cardName").textContent = card.name;

  const stats = document.getElementById("statsContainer");
  stats.innerHTML = "";
  const isMyTurn = currentPlayer === myPlayer;
  CATEGORIES.forEach(cat => {
    const row = document.createElement("div");
    row.className = "stat-row";
    const cls = cat.higher ? "higher" : "lower";
    row.innerHTML = `
      <span class="stat-label ${cls}">${cat.label}</span>
      <span class="stat-value">${card[cat.key]} ${cat.unit}</span>
    `;
    if (isMyTurn) {
      row.onclick = () => playCategory(cat);
    } else {
      row.style.opacity = "0.5";
      row.style.cursor = "default";
    }
    stats.appendChild(row);
  });

  const pileInfo = document.getElementById("pileInfo");
  pileInfo.textContent = pendingCards.length > 0 
    ? `${pendingCards.length} Karten liegen (Gleichstand)` 
    : "";
  document.getElementById("resultDisplay").textContent = "";
}

function playCategory(cat) {
  if (!gameActive || currentPlayer !== myPlayer) return;
  const p1Card = player1[0];
  const p2Card = player2[0];
  if (!p1Card || !p2Card) return;

  const v1 = p1Card[cat.key];
  const v2 = p2Card[cat.key];
  let winner = 0;
  if (cat.higher) {
    if (v1 > v2) winner = 1;
    else if (v2 > v1) winner = 2;
  } else {
    if (v1 < v2) winner = 1;
    else if (v2 < v1) winner = 2;
  }

  const resultEl = document.getElementById("resultDisplay");
  const cardsToWin = [p1Card, p2Card, ...pendingCards];

  if (winner === 0) {
    resultEl.className = "result tie";
    resultEl.textContent = "Gleichstand – Karten bleiben liegen";
    pendingCards.push(player1.shift(), player2.shift());
  } else {
    resultEl.className = winner === myPlayer ? "result win" : "result lose";
    resultEl.textContent = `Spieler ${winner} gewinnt!`;
    if (winner === 1) player1.push(...cardsToWin);
    else player2.push(...cardsToWin);
    player1.shift();
    player2.shift();
    pendingCards = [];
  }

  currentPlayer = currentPlayer === 1 ? 2 : 1;
  setTimeout(updateUI, 1200);
}

function endGame(winner) {
  gameActive = false;
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.remove("hidden");
  document.getElementById("winnerText").textContent = `Spieler ${winner} hat alle Karten!`;
}
</script>
</body>
</html>
