<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinnerCards: 4th & 5th Gen Fighters</title>
<style>
  :root {
    --bg: #0f1419;
    --card-bg: #1a2332;
    --cyan: #00d4ff;
    --orange: #ff9f43;
    --white: #ffffff;
    --muted: #8b9bb4;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 12px;
  }
  .header {
    text-align: center;
    margin-bottom: 8px;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .status-line {
    text-align: center;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .status-line .turn { color: var(--cyan); font-weight: 600; }
  .status-line .win { color: var(--green); font-weight: 700; }
  .status-line .lose { color: var(--red); font-weight: 700; }
  .card-display {
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid #2a3a50;
    position: relative;
  }
  .card-image {
    width: 100%;
    height: 200px;
    object-fit: contain;
    background: #111820;
    transition: border 0.2s;
  }
  .card-image.peek {
    border: 4px solid #fbbf24;
    box-shadow: 0 0 20px #fbbf24;
  }
  .card-name {
    text-align: center;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 10px 8px 4px;
  }
  .stats { padding: 0 12px 12px; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #2a3a50;
    cursor: pointer;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row:hover, .stat-row:active { background: #243044; }
  .stat-label { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .stat-label.higher { color: var(--cyan); }
  .stat-label.lower { color: var(--orange); }
  .stat-value { font-weight: 500; color: var(--white); display: flex; align-items: center; gap: 6px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .dot.better { background: var(--green); }
  .dot.medium { background: #ffffff; }
  .dot.worse { background: var(--red); }
  .dot.hidden-dot { display: none; }
  .result {
    text-align: center;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    min-height: 48px;
  }
  .hidden { display: none; }
  .lobby, .game-over { text-align: center; padding: 40px 16px; }
  button, input {
    background: var(--cyan);
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin: 8px;
  }
  input {
    background: #243044;
    color: white;
    text-align: center;
    width: 140px;
    letter-spacing: 4px;
    font-size: 1.2rem;
  }
  .pile-info {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 8px;
  }
  .room-code {
    font-size: 2rem;
    letter-spacing: 8px;
    font-weight: 700;
    color: var(--cyan);
    margin: 16px 0;
  }
  .debug-wrap {
    margin-top: 20px;
    text-align: center;
  }
  .debug-toggle {
    background: #243044;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 8px;
  }
  .debug {
    background: #1a2332;
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: left;
    display: none;
  }
  .debug.open { display: block; }
  .image-dots {
    text-align: center;
    padding: 6px 0;
  }
  .image-dots span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4a5568;
    margin: 0 3px;
  }
  .image-dots span.active { background: var(--cyan); }
  .reveal-btn {
    display: block;
    width: 90%;
    margin: 12px auto;
    background: var(--orange);
    color: #000;
  }
  .joker-area {
    text-align: center;
    margin: 16px 0;
  }
  .joker-btn {
    background: #fbbf24;
    color: #000;
    font-weight: 700;
  }
  .joker-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="header">WinnerCards: 4th & 5th Gen Fighters</div>
<div class="status-line" id="statusLine">Waiting…</div>

<div id="lobby" class="lobby">
  <button onclick="createRoom()">Create Room</button>
  <div style="margin: 24px 0; color: var(--muted);">or</div>
  <div>
    <input id="joinCode" type="text" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="CODE">
    <button onclick="joinRoom()">Join</button>
  </div>
  <div id="lobbyStatus" style="margin-top:20px; color:var(--muted);"></div>
</div>

<div id="gameScreen" class="hidden">
  <div class="pile-info" id="pileInfo"></div>
  <div class="card-display">
    <img class="card-image" id="cardImage" src="" alt="">
    <div class="image-dots" id="imageDots"></div>
    <div class="card-name" id="cardName">—</div>
    <div class="stats" id="statsContainer"></div>
  </div>
  <div id="revealArea"></div>
  <div class="joker-area" id="jokerArea"></div>
  <div class="result" id="resultDisplay"></div>
  <div class="debug-wrap">
    <button class="debug-toggle" onclick="document.getElementById('debugInfo').classList.toggle('open')">Debug</button>
    <div class="debug" id="debugInfo"></div>
  </div>
</div>

<div id="gameOverScreen" class="game-over hidden">
  <h2 id="winnerText"></h2>
  <button onclick="location.reload()">New Game</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaBiEDrDw_tDxGSwEf6vBmQbPPDq_Ftu8",
  authDomain: "winnercards-e0343.firebaseapp.com",
  databaseURL: "https://winnercards-e0343-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "winnercards-e0343",
  storageBucket: "winnercards-e0343.firebasestorage.app",
  messagingSenderId: "563899363919",
  appId: "1:563899363919:web:ea3b085a70268ead2bf03a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomCode = null;
let myPlayer = null;
let cards = [];
let criteria = [];
let gameRef = null;
let currentImageIndex = 0;
let currentImages = [];
let autoRotateTimer = null;
let jokersLeft = 3;
let jokerTypes = [];

const icons = {
  speed: "🚀",
  thrust: "🔥",
  ceiling: "🏔️",
  weight: "⚖️",
  range: "🗺️",
  climb: "📈",
  thrusttoweight: "💪",
  payload: "💣"
};

function formatNumber(n) {
  if (n === undefined || n === null || n === "—") return "—";
  const num = Number(n);
  if (isNaN(num)) return n;
  return num.toLocaleString("en-US");
}

async function loadCards() {
  const res = await fetch("4and5genfighters.json");
  const data = await res.json();
  cards = data.cards;
  criteria = data.criteria || [];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

window.createRoom = async function() {
  await loadCards();
  roomCode = generateCode();
  myPlayer = 1;
  const deck = shuffle(cards);
  jokerTypes = shuffle(["colors", "peek", "skip"]);
  const initialState = {
    p1: deck.slice(0, 16),
    p2: deck.slice(16),
    turn: Math.random() < 0.5 ? 1 : 2,
    pending: [],
    status: "waiting",
    lastWinner: null,
    debug: null,
    reveal: null
  };
  gameRef = ref(db, `rooms/${roomCode}`);
  await set(gameRef, initialState);
  document.getElementById("lobbyStatus").innerHTML = `
    <div>Code:</div>
    <div class="room-code">${roomCode}</div>
    <div>Waiting for player 2…</div>
  `;
  listenToGame();
};

window.joinRoom = async function() {
  const code = document.getElementById("joinCode").value.trim();
  if (code.length !== 4) return;
  await loadCards();
  roomCode = code;
  myPlayer = 2;
  jokerTypes = shuffle(["colors", "peek", "skip"]);
  gameRef = ref(db, `rooms/${roomCode}`);
  const snap = await get(gameRef);
  if (!snap.exists()) {
    document.getElementById("lobbyStatus").textContent = "Room not found";
    return;
  }
  await update(gameRef, { status: "playing" });
  document.getElementById("lobby").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  listenToGame();
};

function listenToGame() {
  onValue(gameRef, (snap) => {
    const state = snap.val();
    if (!state) return;
    if (state.status === "playing") {
      document.getElementById("lobby").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
    }
    renderState(state);
  });
}

function getImages(card) {
  if (card.images && card.images.length) return card.images.filter(Boolean);
  if (card.image) return [card.image];
  return [];
}

function resolveImageSrc(src) {
  if (!src) return "";
  if (src.startsWith("http")) return src;
  return `images/${src}`;
}

function updateDots() {
  document.querySelectorAll("#imageDots span").forEach((s, i) => {
    s.classList.toggle("active", i === currentImageIndex);
  });
}

function startAutoRotate() {
  if (autoRotateTimer) clearInterval(autoRotateTimer);
  if (currentImages.length <= 1) return;
  setTimeout(() => {
    currentImageIndex = (currentImageIndex + 1) % currentImages.length;
    document.getElementById("cardImage").src = resolveImageSrc(currentImages[currentImageIndex]);
    updateDots();
    autoRotateTimer = setInterval(() => {
      currentImageIndex = (currentImageIndex + 1) % currentImages.length;
      document.getElementById("cardImage").src = resolveImageSrc(currentImages[currentImageIndex]);
      updateDots();
    }, 1500);
  }, 2500);
}

function renderJokerButton() {
  const area = document.getElementById("jokerArea");
  area.innerHTML = "";
  if (jokersLeft <= 0) return;
  const btn = document.createElement("button");
  btn.className = "joker-btn";
  btn.textContent = `Joker (${jokersLeft})`;
  btn.onclick = useJoker;
  area.appendChild(btn);
}

function useJoker() {
  if (jokersLeft <= 0 || !jokerTypes.length) return;
  const type = jokerTypes.shift();
  jokersLeft--;
  renderJokerButton();

  if (type === "colors") {
    document.querySelectorAll(".dot").forEach(d => d.classList.remove("hidden-dot"));
    setTimeout(() => {
      document.querySelectorAll(".dot").forEach(d => d.classList.add("hidden-dot"));
    }, 3000);
  } else if (type === "peek") {
    // Peek: show opponent's schema image with frame
    gameRef && get(gameRef).then(snap => {
      const state = snap.val();
      if (!state) return;
      const oppCards = myPlayer === 1 ? (state.p2 || []) : (state.p1 || []);
      if (!oppCards.length) return;
      const oppImg = getImages(oppCards[0])[0];
      const img = document.getElementById("cardImage");
      const original = img.src;
      img.src = resolveImageSrc(oppImg);
      img.classList.add("peek");
      setTimeout(() => {
        img.src = original;
        img.classList.remove("peek");
      }, 3000);
    });
  } else if (type === "skip") {
    // Skip own card, opponent keeps theirs
    gameRef && get(gameRef).then(async snap => {
      const state = snap.val();
      if (!state) return;
      const p1 = [...(state.p1 || [])];
      const p2 = [...(state.p2 || [])];
      if (myPlayer === 1 && p1.length) {
        const skipped = p1.shift();
        p1.push(skipped);
        await update(gameRef, { p1, debug: "Joker: Player 1 skipped card" });
      } else if (myPlayer === 2 && p2.length) {
        const skipped = p2.shift();
        p2.push(skipped);
        await update(gameRef, { p2, debug: "Joker: Player 2 skipped card" });
      }
    });
  }
}

function renderState(state) {
  const myCards = myPlayer === 1 ? (state.p1 || []) : (state.p2 || []);
  if (myCards.length === 0) {
    endGame(myPlayer === 1 ? 2 : 1);
    return;
  }
  const card = myCards[0];
  const isMyTurn = state.turn === myPlayer && state.status === "playing";

  let statusExtra = "";
  if (state.lastWinner === myPlayer) statusExtra = ' <span class="win">You win!</span>';
  else if (state.lastWinner && state.lastWinner !== myPlayer) statusExtra = ' <span class="lose">You lost</span>';

  document.getElementById("statusLine").innerHTML = `
    <span class="turn">${isMyTurn ? "Your turn" : "Opponent's turn"}</span>
    · Your cards: ${myCards.length}${statusExtra}
  `;

  currentImages = getImages(card);
  currentImageIndex = 0;
  const imgEl = document.getElementById("cardImage");
  imgEl.src = currentImages.length ? resolveImageSrc(currentImages[0]) : "";
  imgEl.onerror = () => {
    currentImages = currentImages.filter((_, i) => i !== currentImageIndex);
    if (currentImages.length) {
      currentImageIndex = currentImageIndex % currentImages.length;
      imgEl.src = resolveImageSrc(currentImages[currentImageIndex]);
      updateDots();
    }
  };
  startAutoRotate();

  const dots = document.getElementById("imageDots");
  dots.innerHTML = currentImages.map((_, i) => `<span class="${i===0?'active':''}"></span>`).join("");

  const flag = card.flag || "";
  document.getElementById("cardName").textContent = `${flag} ${card.name}`.trim();

  const stats = document.getElementById("statsContainer");
  stats.innerHTML = "";
  criteria.forEach(cat => {
    const row = document.createElement("div");
    row.className = "stat-row";
    const cls = cat.higher ? "higher" : "lower";
    const val = formatNumber(card[cat.key]);
    const rating = card.ratings?.[cat.key] || "medium";
    const icon = icons[cat.key] || "•";
    row.innerHTML = `
      <span class="stat-label ${cls}">
        <span class="dot ${rating} hidden-dot"></span>
        ${cat.label}
      </span>
      <span class="stat-value">${val} ${cat.unit}</span>
    `;
    if (isMyTurn && !state.reveal) {
      row.onclick = () => playCategory(cat, state);
    } else {
      row.querySelector(".stat-label").style.opacity = "0.45";
      row.style.cursor = "default";
    }
    stats.appendChild(row);
  });

  document.getElementById("pileInfo").textContent = (state.pending && state.pending.length)
    ? `${state.pending.length} cards on the pile (tie)`
    : "";

  document.getElementById("debugInfo").textContent = state.debug || "";

  const revealArea = document.getElementById("revealArea");
  revealArea.innerHTML = "";
  if (state.reveal) {
    const r = state.reveal;
    const btn = document.createElement("button");
    btn.className = "reveal-btn";

    const step = r.step || 1;

    if (step === 1 && myPlayer === r.by) {
      btn.textContent = `Your ${r.label}: ${formatNumber(r.myValue)} ${r.unit}`;
      btn.onclick = () => confirmReveal(state);
    } else if (step === 2 && myPlayer !== r.by) {
      btn.textContent = `Opponent's ${r.label}: ${formatNumber(r.myValue)} ${r.unit}`;
      btn.onclick = () => confirmReveal(state);
    } else if (step === 3 && myPlayer !== r.by) {
      const myCards = myPlayer === 1 ? (state.p1 || []) : (state.p2 || []);
      const myVal = myCards[0]?.[r.key];
      btn.textContent = `Your ${r.label}: ${formatNumber(myVal)} ${r.unit}`;
      btn.onclick = () => confirmReveal(state);
    } else {
      btn.textContent = "Waiting…";
      btn.disabled = true;
    }
    revealArea.appendChild(btn);
  }

  renderJokerButton();

  const resultEl = document.getElementById("resultDisplay");
  resultEl.className = "result";
  resultEl.textContent = "";
}

async function playCategory(cat, state) {
  const p1 = [...(state.p1 || [])];
  const p2 = [...(state.p2 || [])];
  if (p1.length === 0 || p2.length === 0) return;

  const c1 = p1[0];
  const c2 = p2[0];
  const myCard = myPlayer === 1 ? c1 : c2;

  await update(gameRef, {
    reveal: {
      key: cat.key,
      label: cat.label,
      unit: cat.unit,
      higher: cat.higher,
      myValue: myCard[cat.key],
      by: myPlayer,
      step: 1
    },
    debug: `Selected: ${cat.label} – step 1`
  });
}

async function confirmReveal(state) {
  const r = state.reveal;
  if (!r) return;

  const step = r.step || 1;

  if (step === 1 && myPlayer === r.by) {
    await update(gameRef, {
      reveal: { ...r, step: 2 },
      debug: `${r.label} confirmed by chooser – opponent sees value`
    });
    return;
  }

  if (step === 2 && myPlayer !== r.by) {
    await update(gameRef, {
      reveal: { ...r, step: 3 },
      debug: `Opponent saw chooser's value – now confirms own value`
    });
    return;
  }

  if (step === 3 && myPlayer !== r.by) {
    // Resolve
    const p1 = [...(state.p1 || [])];
    const p2 = [...(state.p2 || [])];
    const c1 = p1[0];
    const c2 = p2[0];

    const v1 = Number(c1[r.key]);
    const v2 = Number(c2[r.key]);

    let winner = 0;
    if (!isNaN(v1) && !isNaN(v2)) {
      if (r.higher) {
        if (v1 > v2) winner = 1;
        else if (v2 > v1) winner = 2;
      } else {
        if (v1 < v2) winner = 1;
        else if (v2 < v1) winner = 2;
      }
    }

    const pending = [...(state.pending || [])];
    const wonCards = [c1, c2, ...pending];

    let newP1 = p1.slice(1);
    let newP2 = p2.slice(1);
    let newPending = [];
    let nextTurn = state.turn;

    if (winner === 0) {
      newPending = [...pending, c1, c2];
      nextTurn = state.turn;
    } else {
      if (winner === 1) newP1 = [...newP1, ...wonCards];
      else newP2 = [...newP2, ...wonCards];
      nextTurn = winner;
    }

    const debugText = `${r.label}: ${c1.name} (${v1}) vs ${c2.name} (${v2}) → Winner: ${winner === 0 ? "Tie" : "Player " + winner}`;

    await update(gameRef, {
      p1: newP1,
      p2: newP2,
      pending: newPending,
      turn: nextTurn,
      lastWinner: winner,
      debug: debugText,
      reveal: null
    });

    // Flash feedback
    if (winner === myPlayer) flash("green");
    else if (winner !== 0) flash("red");
  }
}

function flash(color) {
  const overlay = document.createElement("div");
  overlay.style.cssText = `
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: ${color === "green" ? "rgba(74,222,128,0.35)" : "rgba(248,113,113,0.35)"};
    transition: opacity 0.4s;
  `;
  document.body.appendChild(overlay);
  setTimeout(() => overlay.style.opacity = "0", 50);
  setTimeout(() => overlay.remove(), 450);
}

function endGame(winner) {
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.remove("hidden");
  document.getElementById("winnerText").textContent = winner === myPlayer ? "" : "You lost";
}
</script>
</body>
</html>
