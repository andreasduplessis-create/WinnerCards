<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinnerCards – Kampfflieger</title>
<style>
  :root {
    --bg: #0f1419;
    --card-bg: #1a2332;
    --cyan: #00d4ff;
    --orange: #ff9f43;
    --white: #ffffff;
    --muted: #8b9bb4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 12px;
  }
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 { font-size: 1.4rem; }
  .status {
    background: #243044;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 16px;
    text-align: center;
  }
  .status .turn { font-size: 1.1rem; font-weight: 600; color: var(--cyan); }
  .status .counts { color: var(--muted); margin-top: 4px; }
  .card-display {
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid #2a3a50;
  }
  .card-image {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #111820;
  }
  .card-name {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    padding: 12px 8px 4px;
  }
  .stats { padding: 0 12px 12px; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #2a3a50;
    cursor: pointer;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row:hover, .stat-row:active { background: #243044; }
  .stat-label { font-weight: 600; }
  .stat-label.higher { color: var(--cyan); }
  .stat-label.lower { color: var(--orange); }
  .stat-value { font-weight: 500; }
  .result {
    text-align: center;
    padding: 16px;
    font-size: 1.2rem;
    font-weight: 700;
    min-height: 60px;
  }
  .result.win { color: #4ade80; }
  .result.lose { color: #f87171; }
  .result.tie { color: #fbbf24; }
  .hidden { display: none; }
  .lobby, .game-over { text-align: center; padding: 40px 16px; }
  button, input {
    background: var(--cyan);
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin: 8px;
  }
  input {
    background: #243044;
    color: white;
    text-align: center;
    width: 140px;
    letter-spacing: 4px;
    font-size: 1.2rem;
  }
  .pile-info {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 8px;
  }
  .room-code {
    font-size: 2rem;
    letter-spacing: 8px;
    font-weight: 700;
    color: var(--cyan);
    margin: 16px 0;
  }
  .debug {
    background: #1a2332;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: left;
  }
</style>
</head>
<body>

<div class="header">
  <h1>WinnerCards</h1>
  <div>Kampfflieger Top Ass</div>
</div>

<div id="lobby" class="lobby">
  <button onclick="createRoom()">Runde erstellen</button>
  <div style="margin: 24px 0; color: var(--muted);">oder</div>
  <div>
    <input id="joinCode" type="text" maxlength="4" placeholder="CODE" style="text-transform:uppercase">
    <button onclick="joinRoom()">Beitreten</button>
  </div>
  <div id="lobbyStatus" style="margin-top:20px; color:var(--muted);"></div>
</div>

<div id="gameScreen" class="hidden">
  <div class="status">
    <div class="turn" id="turnDisplay">Warte auf Spieler…</div>
    <div class="counts" id="countDisplay"></div>
  </div>
  <div class="debug" id="debugInfo"></div>
  <div class="pile-info" id="pileInfo"></div>
  <div class="card-display">
    <img class="card-image" id="cardImage" src="" alt="">
    <div class="card-name" id="cardName">—</div>
    <div class="stats" id="statsContainer"></div>
  </div>
  <div class="result" id="resultDisplay"></div>
</div>

<div id="gameOverScreen" class="game-over hidden">
  <h2 id="winnerText"></h2>
  <button onclick="location.reload()">Neues Spiel</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaBiEDrDw_tDxGSwEf6vBmQbPPDq_Ftu8",
  authDomain: "winnercards-e0343.firebaseapp.com",
  databaseURL: "https://winnercards-e0343-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "winnercards-e0343",
  storageBucket: "winnercards-e0343.firebasestorage.app",
  messagingSenderId: "563899363919",
  appId: "1:563899363919:web:ea3b085a70268ead2bf03a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const CATEGORIES = [
  { key: "speed", label: "SPEED", higher: true, unit: "km/h" },
  { key: "thrust_hubkraft", label: "HUBKRAFT", higher: true, unit: "kg" },
  { key: "ceiling", label: "CEILING", higher: true, unit: "m" },
  { key: "empty_weight", label: "EMPTY", higher: false, unit: "kg" },
  { key: "range", label: "RANGE", higher: true, unit: "km" },
  { key: "climb", label: "CLIMB", higher: true, unit: "m/s" },
  { key: "tw_ratio", label: "T/W", higher: true, unit: "" },
  { key: "payload", label: "PAYLOAD", higher: false, unit: "kg" }
];

let roomCode = null;
let myPlayer = null;
let cards = [];
let gameRef = null;

async function loadCards() {
  const res = await fetch("kampfflieger_topass_dataset.json");
  const data = await res.json();
  cards = data.cards;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateCode() {
  return Math.random().toString(36).substring(2, 6).toUpperCase();
}

window.createRoom = async function() {
  await loadCards();
  roomCode = generateCode();
  myPlayer = 1;
  const deck = shuffle(cards);
  const initialState = {
    p1: deck.slice(0, 16),
    p2: deck.slice(16),
    turn: Math.random() < 0.5 ? 1 : 2,
    pending: [],
    status: "waiting",
    lastWinner: null,
    debug: null
  };
  gameRef = ref(db, `rooms/${roomCode}`);
  await set(gameRef, initialState);
  document.getElementById("lobbyStatus").innerHTML = `
    <div>Code:</div>
    <div class="room-code">${roomCode}</div>
    <div>Warte auf Spieler 2…</div>
  `;
  listenToGame();
};

window.joinRoom = async function() {
  const code = document.getElementById("joinCode").value.trim().toUpperCase();
  if (code.length !== 4) return;
  roomCode = code;
  myPlayer = 2;
  gameRef = ref(db, `rooms/${roomCode}`);
  const snap = await get(gameRef);
  if (!snap.exists()) {
    document.getElementById("lobbyStatus").textContent = "Raum nicht gefunden";
    return;
  }
  await update(gameRef, { status: "playing" });
  document.getElementById("lobby").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  listenToGame();
};

function listenToGame() {
  onValue(gameRef, (snap) => {
    const state = snap.val();
    if (!state) return;
    if (state.status === "playing") {
      document.getElementById("lobby").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
    }
    renderState(state);
  });
}

function renderState(state) {
  const myCards = myPlayer === 1 ? (state.p1 || []) : (state.p2 || []);
  if (myCards.length === 0) {
    endGame(myPlayer === 1 ? 2 : 1);
    return;
  }
  const card = myCards[0];
  const isMyTurn = state.turn === myPlayer && state.status === "playing";

  document.getElementById("turnDisplay").textContent = isMyTurn ? "Du bist am Zug" : "Gegner ist am Zug";
  document.getElementById("countDisplay").textContent = `Karten: ${(state.p1||[]).length} | ${(state.p2||[]).length}`;
  document.getElementById("cardImage").src = `images/${card.image}`;
  document.getElementById("cardName").textContent = card.name;

  const stats = document.getElementById("statsContainer");
  stats.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const row = document.createElement("div");
    row.className = "stat-row";
    const cls = cat.higher ? "higher" : "lower";
    const val = card[cat.key] ?? "—";
    row.innerHTML = `
      <span class="stat-label ${cls}">${cat.label}</span>
      <span class="stat-value">${val} ${cat.unit}</span>
    `;
    if (isMyTurn) {
      row.onclick = () => playCategory(cat, state);
    } else {
      row.style.opacity = "0.5";
      row.style.cursor = "default";
    }
    stats.appendChild(row);
  });

  document.getElementById("pileInfo").textContent = (state.pending && state.pending.length)
    ? `${state.pending.length} Karten liegen (Gleichstand)`
    : "";

  const debug = document.getElementById("debugInfo");
  if (state.debug) {
    debug.innerHTML = state.debug;
  } else {
    debug.textContent = "";
  }

  const resultEl = document.getElementById("resultDisplay");
  resultEl.className = "result";
  if (state.lastWinner === 0) {
    resultEl.textContent = "Gleichstand – Karten bleiben liegen";
    resultEl.classList.add("tie");
  } else if (state.lastWinner === myPlayer) {
    resultEl.textContent = "Du hast gewonnen!";
    resultEl.classList.add("win");
  } else if (state.lastWinner && state.lastWinner !== myPlayer) {
    resultEl.textContent = "Du hast verloren";
    resultEl.classList.add("lose");
  } else {
    resultEl.textContent = "";
  }
}

async function playCategory(cat, state) {
  const p1 = [...(state.p1 || [])];
  const p2 = [...(state.p2 || [])];
  if (p1.length === 0 || p2.length === 0) return;

  const c1 = p1[0];
  const c2 = p2[0];
  const v1 = Number(c1[cat.key]);
  const v2 = Number(c2[cat.key]);

  let winner = 0;
  if (!isNaN(v1) && !isNaN(v2)) {
    if (cat.higher) {
      if (v1 > v2) winner = 1;
      else if (v2 > v1) winner = 2;
    } else {
      if (v1 < v2) winner = 1;
      else if (v2 < v1) winner = 2;
    }
  }

  const pending = [...(state.pending || [])];
  const wonCards = [c1, c2, ...pending];

  let newP1 = p1.slice(1);
  let newP2 = p2.slice(1);
  let newPending = [];
  let nextTurn = state.turn;

  if (winner === 0) {
    newPending = [...pending, c1, c2];
    nextTurn = state.turn === 1 ? 2 : 1;
  } else {
    if (winner === 1) newP1 = [...newP1, ...wonCards];
    else newP2 = [...newP2, ...wonCards];
    nextTurn = winner;
  }

  const debugText = `${cat.label}: ${c1.name} (${v1}) vs ${c2.name} (${v2}) → Gewinner: ${winner === 0 ? "Gleichstand" : "Spieler " + winner}`;

  await update(gameRef, {
    p1: newP1,
    p2: newP2,
    pending: newPending,
    turn: nextTurn,
    lastWinner: winner,
    debug: debugText
  });
}

function endGame(winner) {
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.remove("hidden");
  document.getElementById("winnerText").textContent = winner === myPlayer ? "Du hast gewonnen!" : "Du hast verloren";
}
</script>
</body>
</html>
